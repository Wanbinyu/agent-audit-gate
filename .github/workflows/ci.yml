name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

      - name: CLI smoke
        shell: bash
        run: |
          audit-gate --version
          audit-gate check examples/run_completed.json --quiet
          audit-gate from-events examples/tool_events_ok.jsonl --claimed completed --quiet
