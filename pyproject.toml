[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit-gate"
version = "0.3.0"
description = "Sidecar completion audit for coding agents: evidence decides completed vs blocked."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wanbinyu" }]
keywords = [
  "agent",
  "audit",
  "evidence",
  "completion",
  "claude-code",
  "coding-agent",
  "ci",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
audit-gate = "agent_audit_gate.cli:app"

[project.urls]
Homepage = "https://github.com/Wanbinyu/agent-audit-gate"
Documentation = "https://github.com/Wanbinyu/agent-audit-gate#readme"
Issues = "https://github.com/Wanbinyu/agent-audit-gate/issues"
Repository = "https://github.com/Wanbinyu/agent-audit-gate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
